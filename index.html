<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f1">
  <meta name="description" content="Hisaably is your smart money manager that tracks every expense and keeps your budget on track.">
  <meta name="application-name" content="Hisaably">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hisaably">
  <title>Hisaably — Hisaab rakho, bachat badhao</title>
  <style>
    :root {
      --paper:#f5f6f1; --surface:#fff; --ink:#18251f; --muted:#7d8982; --line:#e7ebe5;
      --green:#245b46; --green-2:#32765a; --mint:#dcefe3; --lime:#d7ed9a; --pale:#eff5ec;
      --coral:#ed997f; --gold:#e6be71; --blue:#9ab9c5; --shadow:0 12px 36px rgba(27,49,37,.055);
      --radius:20px; --sidebar:246px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Segoe UI",Inter,system-ui,-apple-system,sans-serif;letter-spacing:-.012em}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(50,118,90,.25);outline-offset:2px}
    .app-shell{min-height:100vh}
    .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);padding:27px 17px 20px;background:#f8f9f5;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
    .brand{display:flex;align-items:center;gap:11px;padding:1px 11px 29px}
    .brand-mark{width:36px;height:36px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#f4f5e9}
    .brand-mark svg{width:21px;height:21px}
    .brand-name{font-size:20px;font-weight:760;letter-spacing:-.055em}
    .brand-caption{font-size:10px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;margin-top:-1px}
    .nav-label{padding:7px 12px 9px;color:#a0aaa3;font-size:10px;letter-spacing:.13em;font-weight:700;text-transform:uppercase}
    .nav-list{display:grid;gap:4px}
    .nav-button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:#65716a;text-align:left;font-size:13px;font-weight:560;transition:.18s}
    .nav-button svg{width:18px;height:18px;flex:none}
    .nav-button:hover{background:#eef2ec;color:var(--ink)}
    .nav-button.active{background:#e6efe6;color:var(--green);font-weight:700}
    .nav-button .nav-count{margin-left:auto;font-size:10px;color:#9aa49c}
    .side-bottom{margin-top:auto}
    .coach-card{position:relative;overflow:hidden;margin:10px 3px 18px;padding:16px 15px 15px;border-radius:16px;background:#e9f1e8}
    .coach-orb{position:absolute;right:-23px;top:-24px;width:78px;height:78px;border-radius:50%;background:#d8e9d6}
    .coach-card strong{position:relative;display:block;font-size:12px;font-weight:700}
    .coach-card p{position:relative;margin:5px 0 11px;color:#6c7a70;font-size:11px;line-height:1.5}
    .coach-card button{position:relative;border:0;padding:0;background:transparent;color:var(--green);font-size:11px;font-weight:700}
    .profile-chip{display:flex;align-items:center;gap:10px;padding:13px 9px 0;border-top:1px solid var(--line)}
    .avatar{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:50%;background:#f1d7c7;color:#714936;font-size:12px;font-weight:800}
    .profile-name{font-size:12px;font-weight:680;line-height:1.25;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .profile-note{margin-top:3px;color:var(--muted);font-size:10px}
    .main{margin-left:var(--sidebar);min-height:100vh;padding:0 38px 52px}
    .app-footer{max-width:1180px;margin:29px auto 0;padding:15px 0 4px;border-top:1px solid var(--line);color:#6d7b72;text-align:center;font-size:12px;font-weight:500;letter-spacing:.025em}
    .app-footer strong{color:#43554a;font-weight:650}
    .app-footer .footer-heart{display:inline-block;margin-left:3px;color:#d77b68;font-size:13px;line-height:1;vertical-align:-1px}
    .dashboard-glitter{position:fixed;inset:0;z-index:70;overflow:hidden;pointer-events:none;contain:strict}
    .dashboard-glitter span{position:absolute;top:-8vh;width:var(--spark-size);height:var(--spark-size);background:var(--spark-color);clip-path:polygon(50% 0,61% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 4px var(--spark-color));opacity:0;animation:dashboard-glitter-fall var(--spark-duration) ease-in var(--spark-delay) forwards}
    @keyframes dashboard-glitter-fall{0%{transform:translate3d(0,-4vh,0) rotate(0) scale(.3);opacity:0}12%{opacity:.9}100%{transform:translate3d(var(--spark-drift),112vh,0) rotate(var(--spark-spin)) scale(.1);opacity:0}}
    .topbar{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(226,232,225,.9)}
    .breadcrumb{font-size:12px;color:#8a958d}
    .breadcrumb strong{color:#526158;font-weight:650}
    .offline-banner{max-width:1180px;margin:14px auto -10px;padding:10px 13px;border:1px solid #ead8ad;border-radius:11px;background:#fff9e9;color:#775f2b;font-size:10px;line-height:1.5}
    .top-actions{display:flex;align-items:center;gap:10px}
    .icon-button{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#607067;display:grid;place-items:center;position:relative}
    .icon-button svg{width:17px;height:17px}
    .icon-button:hover{background:#f7faf5}
    .top-date{padding:7px 11px;border-radius:10px;background:#edf1eb;color:#67766c;font-size:11px;font-weight:600}
    .page{max-width:1180px;margin:0 auto;padding-top:29px}
    .page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
    .eyebrow{font-size:10px;font-weight:750;color:#839087;letter-spacing:.13em;text-transform:uppercase}
    h1{margin:5px 0 0;font-size:29px;line-height:1.16;letter-spacing:-.055em;font-weight:720}
    .heading-sub{margin:7px 0 0;color:var(--muted);font-size:13px}
    .heading-actions{display:flex;align-items:center;gap:9px}
    .month-control{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);background:#fff;border-radius:12px}
    .month-control button{height:29px;width:29px;border:0;border-radius:8px;background:transparent;color:#708077;display:grid;place-items:center}
    .month-control button:hover{background:#f0f4ee}
    .month-control svg{width:15px;height:15px}
    .month-label{min-width:106px;text-align:center;font-size:11px;font-weight:670}
    .btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:40px;padding:0 15px;border:1px solid transparent;border-radius:12px;font-size:12px;font-weight:680;transition:transform .16s,background .16s,border-color .16s}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--green);color:#fff;box-shadow:0 5px 12px rgba(36,91,70,.13)}
    .btn-primary:hover{background:#1d4d3b}
    .btn-soft{background:#edf3ed;color:var(--green)}
    .btn-outline{background:#fff;border-color:var(--line);color:#53645a}
    .btn svg{width:15px;height:15px}
    .hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.17fr .83fr;gap:20px;min-height:222px;padding:27px 30px;border-radius:23px;background:var(--green);color:#f6f7ed;box-shadow:0 15px 34px rgba(27,69,50,.14)}
    .hero:after{content:"";position:absolute;width:350px;height:350px;border:1px solid rgba(232,244,226,.11);border-radius:50%;right:11%;top:-236px;box-shadow:0 0 0 26px rgba(232,244,226,.035),0 0 0 53px rgba(232,244,226,.03),0 0 0 83px rgba(232,244,226,.025);pointer-events:none}
    .hero-copy,.hero-side{position:relative;z-index:1}
    .hero-kicker{display:flex;align-items:center;gap:7px;color:#c7dbca;font-size:11px;font-weight:570}
    .hero-kicker .spark{width:15px;height:15px;color:var(--lime)}
    .hero h2{margin:14px 0 0;font-size:38px;line-height:1.08;letter-spacing:-.065em;font-weight:700}
    .hero h2 span{color:var(--lime)}
    .hero-description{max-width:380px;margin:11px 0 18px;color:#d0e0d3;font-size:12px}
    .hero-actions{display:flex;align-items:center;gap:13px}
    .hero-actions .btn-primary{background:var(--lime);color:#1e3d2d;box-shadow:none}
    .hero-actions .btn-primary:hover{background:#e3f4b9}
    .text-link{border:0;background:transparent;color:#d5e4d6;font-size:11px;font-weight:650}
    .hero-side{align-self:center;justify-self:end;width:min(100%,310px);padding:18px 20px;border:1px solid rgba(255,255,255,.13);border-radius:17px;background:rgba(12,48,32,.15);backdrop-filter:blur(5px)}
    .hero-side-top{display:flex;align-items:center;justify-content:space-between;color:#ccded0;font-size:11px}
    .status-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:99px;background:rgba(215,237,154,.13);color:#e2f0c3;font-size:9px;font-weight:650}
    .status-dot{width:5px;height:5px;border-radius:50%;background:var(--lime)}
    .hero-amount{margin:12px 0 13px;font-size:27px;font-weight:720;letter-spacing:-.055em}
    .hero-meter{height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
    .hero-meter span{display:block;height:100%;border-radius:9px;background:var(--lime);transition:width .35s}
    .hero-side-foot{display:flex;justify-content:space-between;gap:10px;margin-top:9px;color:#c3d4c6;font-size:10px}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:15px}
    .stat-card,.panel{background:var(--surface);border:1px solid rgba(227,232,226,.9);border-radius:var(--radius);box-shadow:var(--shadow)}
    .stat-card{padding:17px 18px 16px;min-width:0}
    .stat-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .stat-label{font-size:11px;color:#7f8b83;font-weight:560}
    .stat-icon{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;background:#eef4ef;color:var(--green)}
    .stat-icon svg{width:15px;height:15px}
    .stat-value{margin-top:11px;font-size:21px;line-height:1.2;letter-spacing:-.05em;font-weight:710;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stat-foot{display:flex;align-items:center;gap:5px;margin-top:6px;color:#8a958e;font-size:10px}
    .stat-foot .up{color:#448264;font-weight:700}
    .content-grid{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(300px,.72fr);gap:15px;margin-top:15px}
    .panel{padding:20px}
    .panel-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
    .panel-title{font-size:14px;font-weight:710;letter-spacing:-.025em}
    .panel-subtitle{margin-top:4px;color:var(--muted);font-size:10px}
    .small-select{border:1px solid var(--line);border-radius:9px;background:#fff;padding:7px 10px;color:#718078;font-size:10px}
    .allocation-card{margin-top:17px;padding:15px 15px 13px;border-radius:14px;background:#f6f8f4}
    .allocation-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
    .allocation-amount{font-size:21px;font-weight:720;letter-spacing:-.05em}
    .allocation-note{color:#829087;font-size:10px}
    .allocation-percent{color:var(--green);font-size:11px;font-weight:700}
    .allocation-bar{height:9px;display:flex;overflow:hidden;margin-top:12px;border-radius:10px;background:#e5eae3}
    .allocation-bar span{height:100%;transition:width .3s}
    .allocation-bar .fixed{background:#2e7052}
    .allocation-bar .saved{background:#b2d17c}
    .allocation-bar .flex{background:#e4b06e}
    .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
    .legend-item{display:flex;align-items:center;gap:6px;color:#77847a;font-size:10px}
    .legend-dot{width:7px;height:7px;border-radius:3px}
    .budget-list{display:grid;gap:14px;margin-top:18px}
    .budget-row{display:grid;grid-template-columns:minmax(112px,1fr) minmax(90px,1.5fr) auto;align-items:center;gap:12px}
    .budget-category{display:flex;align-items:center;gap:8px;min-width:0}
    .category-icon{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:9px;background:#f0f4ed;color:#557b60}
    .category-icon svg{width:14px;height:14px}
    .category-name{font-size:10px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .category-detail{margin-top:2px;color:#9aa39c;font-size:9px}
    .progress-track{height:5px;border-radius:6px;background:#edf0ea;overflow:hidden}
    .progress-track span{display:block;height:100%;border-radius:6px;background:#8ab69a}
    .budget-values{text-align:right;white-space:nowrap}
    .budget-values strong{display:block;font-size:10px;font-weight:680}
    .budget-values small{font-size:9px;color:#98a199}
    .link-button{border:0;padding:5px 0;background:transparent;color:var(--green);font-size:10px;font-weight:700}
    .chart-wrap{margin-top:16px}
    .chart-summary{display:flex;align-items:baseline;gap:7px;margin-bottom:16px}
    .chart-total{font-size:23px;font-weight:720;letter-spacing:-.05em}
    .chart-change{color:#548263;font-size:10px;font-weight:650}
    .chart{height:135px;display:flex;align-items:flex-end;gap:clamp(8px,2.2vw,18px);padding:0 3px;border-bottom:1px solid var(--line)}
    .chart-column{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
    .chart-column:before,.chart-column:after{content:"";position:absolute;left:0;right:0;border-top:1px dashed #edf0eb;z-index:0}
    .chart-column:before{top:25%}.chart-column:after{top:55%}
    .chart-bar{position:relative;z-index:1;width:min(25px,72%);min-height:3px;border-radius:7px 7px 2px 2px;background:#c9dfce;transition:height .3s}
    .chart-column.current .chart-bar{background:#408362}
    .chart-labels{display:flex;justify-content:space-around;padding:8px 0 0;color:#9ba49d;font-size:9px}
    .chart-legend{display:flex;align-items:center;gap:6px;color:#8b958d;font-size:9px}
    .chart-legend:before{content:"";width:7px;height:7px;border-radius:3px;background:#408362}
    .goal-panel{margin-top:15px}
    .goal-main{display:flex;align-items:center;gap:16px;margin-top:18px}
    .goal-ring{--progress:36%;width:78px;height:78px;flex:none;display:grid;place-items:center;border-radius:50%;background:conic-gradient(#629b74 var(--progress),#e9efe7 var(--progress));position:relative}
    .goal-ring:after{content:"";position:absolute;inset:7px;border-radius:50%;background:white}
    .goal-ring span{position:relative;z-index:1;font-size:14px;font-weight:750}
    .goal-title{font-size:12px;font-weight:710}
    .goal-meta{margin-top:4px;color:#849087;font-size:10px}
    .goal-meta strong{color:#596a60;font-weight:680}
    .goal-progress{height:5px;margin-top:9px;border-radius:8px;background:#eef1eb;overflow:hidden}
    .goal-progress span{display:block;height:100%;border-radius:8px;background:#79a884}
    .goal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:15px}
    .soft-note{display:flex;gap:10px;align-items:flex-start;margin-top:15px;padding:12px 13px;border:1px solid #e8eee6;border-radius:13px;background:#f8faf6;color:#748177;font-size:10px}
    .soft-note svg{width:15px;height:15px;flex:none;color:#6e9a72}
    .soft-note strong{display:block;margin-bottom:2px;color:#53655a;font-size:10px}
    .activity-panel{margin-top:15px}
    .transaction-list{display:grid;margin-top:12px}
    .transaction-row{display:grid;grid-template-columns:35px minmax(0,1fr) auto;align-items:center;gap:11px;padding:10px 0;border-top:1px solid #f0f2ee}
    .transaction-row:first-child{border-top:0}
    .transaction-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#f1f4ef;color:#62816b}
    .transaction-icon svg{width:15px;height:15px}
    .transaction-title{font-size:11px;font-weight:670;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .transaction-meta{margin-top:3px;color:#96a098;font-size:9px}
    .transaction-amount{text-align:right;font-size:11px;font-weight:690;white-space:nowrap}
    .transaction-type{margin-top:3px;color:#9aa39c;font-size:9px;text-align:right}
    .empty-state{padding:25px 12px;text-align:center;color:#8a968c;font-size:11px}
    .empty-state strong{display:block;margin-bottom:4px;color:#5f7065;font-size:12px}
    .page-panel{margin-top:12px}
    .search-wrap{position:relative;min-width:200px}
    .search-wrap svg{position:absolute;left:11px;top:10px;width:15px;height:15px;color:#89958c}
    .search-input{width:100%;height:37px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:11px}
    .filter-select{height:37px;padding:0 11px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#65736a;font-size:11px}
    .activity-tools{display:flex;align-items:center;gap:8px}
    .full-list .transaction-row{grid-template-columns:38px minmax(0,1fr) minmax(74px,auto) auto;gap:13px;padding:13px 2px}
    .transaction-category-tag{justify-self:start;padding:4px 8px;border-radius:20px;background:#f4f6f2;color:#768279;font-size:9px}
    .transaction-date{text-align:right;color:#87938a;font-size:10px;white-space:nowrap}
    .budget-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}
    .budget-summary-card{padding:16px;border:1px solid var(--line);border-radius:15px;background:#fbfcfa}
    .budget-summary-card small{display:block;color:#87928a;font-size:10px}
    .budget-summary-card strong{display:block;margin-top:7px;font-size:20px;letter-spacing:-.05em}
    .budget-summary-card span{display:block;margin-top:3px;color:#9aa39c;font-size:9px}
    .budget-detail-row{display:grid;grid-template-columns:minmax(155px,1fr) minmax(100px,1.5fr) auto;align-items:center;gap:17px;padding:14px 0;border-top:1px solid #eff1ed}
    .budget-detail-row:first-child{border-top:0}
    .budget-detail-values{text-align:right;min-width:105px}
    .budget-detail-values strong{display:block;font-size:11px}
    .budget-detail-values small{color:#929d94;font-size:9px}
    .status-text{margin-top:4px;color:#95a098;font-size:9px}
    .goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:15px}
    .goal-card{padding:20px;border:1px solid var(--line);border-radius:18px;background:white;box-shadow:var(--shadow)}
    .goal-card-top{display:flex;justify-content:space-between;align-items:flex-start}
    .goal-card-icon{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:#eff5e9;color:#628957}
    .goal-card-icon svg{width:18px;height:18px}
    .goal-card h3{margin:13px 0 4px;font-size:15px;letter-spacing:-.03em}
    .goal-card p{margin:0;color:#8b978f;font-size:10px}
    .goal-card-progress{margin-top:18px}
    .goal-card-stats{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:#849087;font-size:10px}
    .goal-card-stats strong{color:#4e6155}
    .report-highlight{position:relative;overflow:hidden;padding:23px;border-radius:19px;background:#e8f0e7}
    .report-highlight:after{content:"";position:absolute;right:-35px;top:-90px;width:200px;height:200px;border-radius:50%;border:1px solid #d2e2d2;box-shadow:0 0 0 20px #e2eddf,0 0 0 40px #e5efe2}
    .report-highlight>*{position:relative;z-index:1}
    .report-highlight .eyebrow{color:#728676}
    .report-total{margin-top:8px;font-size:31px;letter-spacing:-.06em;font-weight:730}
    .report-highlight p{margin:5px 0 0;color:#748477;font-size:11px}
    .report-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px}
    .report-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .report-stat small{color:#8c978f;font-size:9px}
    .report-stat strong{display:block;margin-top:7px;font-size:15px;letter-spacing:-.03em}
    .settings-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.72fr);gap:14px;margin-top:15px}
    .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .field{display:grid;gap:6px}
    .field label{color:#637168;font-size:10px;font-weight:660}
    .field input,.field select{width:100%;height:42px;padding:0 12px;border:1px solid #e4e9e2;border-radius:11px;background:#fcfdfb;color:#24332a;font-size:12px}
    .field .prefix-input{position:relative}
    .field .prefix-input input{padding-left:35px}
    .field .prefix-input span{position:absolute;left:12px;top:11px;color:#8c978f;font-size:12px}
    .field-note{color:#9aa39c;font-size:9px}
    .settings-footer{display:flex;justify-content:flex-end;margin-top:16px}

    async function submitLocalWorkspace(e){
      e.preventDefault();prepareDashboardAudio();authError="";authNotice="";
      localNameDraft=normalizedWorkspaceName(new FormData(e.currentTarget).get("name"));
      var button=e.currentTarget.querySelector('button[type="submit"]');
      if(button){button.disabled=true;button.textContent="Opening your workspace…"}
      if(typeof location!=="undefined"&&(location.protocol==="file:"||/\.github\.io$/i.test(location.hostname||""))){
        try{
          var localCopy=await readBrowserWorkspace(localNameDraft);
          if(!localCopy||(!localCopy.plan&&!localCopy.draft)){
            var oldPlan=await readPreviousBrowserPlan();
            if(oldPlan&&normalizedWorkspaceName(oldPlan.name).toLowerCase()===localNameDraft.toLowerCase())localCopy={plan:oldPlan,draft:null}
          }
          authUser={id:"device-"+createProfileId().toLowerCase(),name:localNameDraft,phone:"This browser only",localWorkspace:true,deviceWorkspace:true,standaloneFile:true};
          deviceWorkspaceMode=true;state=localCopy&&localCopy.plan?localCopy.plan:null;
          setupDraft={name:localNameDraft,income:"",currency:"INR",bills:{housing:"",utilities:"",groceries:"",transport:""},savingsRate:20};
          if(state){state.name=localNameDraft;if(!state.reminder)state.reminder={enabled:false,time:"09:00"};if(!state.payables)state.payables=[];if(!state.transactions)state.transactions=[];if(!state.goals)state.goals=[];if(!state.profileId)state.profileId=createProfileId()}
          if(localCopy&&localCopy.draft){setupDraft.income=localCopy.draft.income===""?"":String(localCopy.draft.income);setupDraft.currency=localCopy.draft.currency||"INR";setupDraft.bills=Object.assign(setupDraft.bills,localCopy.draft.bills||{});setupDraft.savingsRate=localCopy.draft.savingsRate===undefined?20:Number(localCopy.draft.savingsRate)}
          if(!await writeBrowserWorkspace(authUser.name,state,localCopy&&localCopy.draft||null,true))throw new Error("This browser blocked local storage. Allow site data for this file and open it again.");
          localNameDraft="";storageReady=true;authError="";authNotice="";render();if(state)scheduleReminder();return
        }catch(error){authUser=null;state=null;authError=error.message;storageReady=true;render();return}
      }
      try{
        var result=await apiRequest("/api/auth/local/open",{method:"POST",body:JSON.stringify({name:localNameDraft})});
        authUser=result.user;deviceWorkspaceMode=false;state=null;await loadAccountPlan(true);
        authError="";authNotice="";localNameDraft="";storageReady=true;render();scheduleReminder()
      }catch(error){
        if(isLocalWorkspaceAddress()&&/local database server is stopped/i.test(error.message)){
          var cached=await readBrowserWorkspace(localNameDraft);
          if(!cached||(!cached.plan&&!cached.draft)){
            var oldPlan=await readPreviousBrowserPlan();
            if(oldPlan&&normalizedWorkspaceName(oldPlan.name).toLowerCase()===localNameDraft.toLowerCase()){
              await writeBrowserWorkspace(localNameDraft,oldPlan,null,false);cached=await readBrowserWorkspace(localNameDraft)
            }
          }
          if(cached&&(cached.plan||cached.draft)){
            authUser={id:"device-"+createProfileId().toLowerCase(),name:localNameDraft,phone:"This browser only",localWorkspace:true,deviceWorkspace:true};
            deviceWorkspaceMode=true;state=cached.plan||null;setupDraft.name=localNameDraft;
            if(state){state.name=localNameDraft;if(!state.reminder)state.reminder={enabled:false,time:"09:00"};if(!state.payables)state.payables=[];if(!state.transactions)state.transactions=[]}
            if(cached.draft){setupDraft.income=cached.draft.income===""?"":String(cached.draft.income);setupDraft.currency=cached.draft.currency||"INR";setupDraft.bills=Object.assign(setupDraft.bills,cached.draft.bills||{});setupDraft.savingsRate=cached.draft.savingsRate===undefined?20:Number(cached.draft.savingsRate)}
            authNotice="The server is offline. This saved copy is on this browser; changes will be stored here until the server reconnects.";
            localNameDraft="";storageReady=true;render();if(state)scheduleReminder();return
          }
          authError="Hisaably's server is offline and this browser has no saved copy for that name. Your server plan is still there. Double-click Start Hisaably.cmd, then enter your name again."
        }else authError=error.message;
        storageReady=true;render()
      }
    }

      }
      if(kind==="saving"){
        var goal=(state.goals||[]).find(function(x){return x.id===form.dataset.goal}),amount=Number(data.get("amount")),date=String(data.get("date"));
        if(!goal||amount<=0){resetModalSubmit(form,submitButton,submitLabel);return}
        goal.saved+=amount;state.transactions.unshift({id:"tx-"+Date.now(),title:"Added to "+goal.name,category:"other",amount:amount,date:date,type:"saving",createdAt:Date.now()});
        if(!await saveModalChange(previous,form,submitButton,submitLabel))return;closeModal();render();notify("Savings contribution saved.")
      }
    }
    async function toggleBill(billId){
      var bill=(state.payables||[]).find(function(item){return item.id===billId});
      if(!bill)return;
      var previous=JSON.parse(JSON.stringify(state));bill.active=bill.active===false;
      if(!await commitPlan(previous))return;
      render();notify(bill.active?"Bill resumed.":"Bill paused.")
    }
    async function saveSettings(e){
      e.preventDefault();var form=e.currentTarget,d=new FormData(form),income=Number(d.get("income")),rate=Number(d.get("savingsRate")),bills=[];
      CATEGORIES.slice(0,4).forEach(function(c){bills.push({id:c.id,amount:Number(d.get("bill-"+c.id))||0})});
      var previous=JSON.parse(JSON.stringify(state));
      state.name=authUser.name;state.currency=String(d.get("currency"));state.income=income;state.savingsRate=rate;state.bills=bills;
      var shortfall=planShortfall();
      if(!await commitPlan(previous))return;render();notify(shortfall>0?"Monthly plan saved. Planned amounts exceed income by "+money(shortfall)+".":"Monthly plan saved.")
    }
    function exportCSV(){
      var rows=monthTotals().rows;
      var lines=[["Date","Type","Description","Category","Amount","Currency","Payment method","Reference","Note"].join(",")];
      function cell(value){var text=String(value==null?"":value);if(/^[=+\-@\t\r]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'}
      rows.slice().reverse().forEach(function(t){lines.push([t.date,t.type||"expense",t.title||category(t.category).name,category(t.category).name,Number(t.amount),state.currency,t.paymentMethod||"",t.reference||"",t.note||""].map(cell).join(","))});
      var blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
      var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="hisaably-"+localISO(displayedDate()).slice(0,7)+"-report.csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);notify("Your monthly CSV is ready.")
    }
    function exportAccountBackup(){
      var backup={format:"hisaably-account-backup",version:1,exportedAt:new Date().toISOString(),account:{id:authUser.id,name:authUser.name,phone:authUser.phone},plan:state};
      var blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json;charset=utf-8"});
      var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="hisaably-backup-"+localISO(today)+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);notify("Your account backup is ready. Keep the file private.")
    }
    function registerServiceWorker(){
      if(!("serviceWorker" in navigator)||location.protocol==="file:")return;
      navigator.serviceWorker.register("./sw.js").then(function(reg){serviceWorkerRegistration=reg;scheduleReminder()}).catch(function(){});
    }
    function scheduleReminder(){
      clearTimeout(reminderTimer);reminderTimer=null;
      if(!state||!state.reminder||!state.reminder.enabled||!("Notification" in window)||Notification.permission!=="granted")return;
      var time=String(state.reminder.time||"09:00").split(":");
      var hour=parseInt(time[0],10),minute=parseInt(time[1],10);
      if(isNaN(hour))hour=9;if(isNaN(minute))minute=0;
      var next=new Date();next.setHours(hour,minute,0,0);
      if(next.getTime()<=Date.now())next.setDate(next.getDate()+1);
      reminderTimer=setTimeout(function(){sendReminder();scheduleReminder()},next.getTime()-Date.now());
    }
    async function sendReminder(){
      var title="A quick check-in with Hisaably";
      var options={body:"Open Hisaably to log today’s spending and keep your budget on track.",icon:"./icon.svg",badge:"./icon.svg",tag:"hisaably-daily",data:{url:location.href}};
      try{
        if(serviceWorkerRegistration&&serviceWorkerRegistration.showNotification)await serviceWorkerRegistration.showNotification(title,options);
        else new Notification(title,options);
      }catch(e){}
    }
    async function toggleReminder(){
      var previous=JSON.parse(JSON.stringify(state));
      state.reminder=state.reminder||{enabled:false,time:"09:00"};
      var timeInput=document.getElementById("reminder-time");
      if(timeInput)state.reminder.time=timeInput.value||"09:00";
      if(state.reminder.enabled){
        state.reminder.enabled=false;clearTimeout(reminderTimer);reminderTimer=null;
        if(!await commitPlan(previous))return;render();notify("Daily reminder is off.");return
      }
      if(!("Notification" in window)){notify("This browser does not support notifications.");return}
      var permission=Notification.permission;
      if(permission==="default"){
        try{permission=await Notification.requestPermission()}catch(e){permission="denied"}
      }
      if(permission!=="granted"){notify("Allow notifications in your browser settings to turn on reminders.");return}
      state.reminder.enabled=true;
      if(!await commitPlan(previous))return;scheduleReminder();render();notify("Daily reminder set for "+state.reminder.time+". Keep Hisaably open for the reminder.")
    }
    async function installApp(){
        if(!deferredInstallPrompt){notify("Install Hisaably from your browser menu when it is opened from a secure website.");return}
      var prompt=deferredInstallPrompt;deferredInstallPrompt=null;
      try{
        await prompt.prompt();
        var choice=await prompt.userChoice;
        notify(choice&&choice.outcome==="accepted"?"Hisaably is ready on your device.":"You can install Hisaably later from the browser menu.")
      }catch(e){notify("Choose Install from the browser menu to add Hisaably to your device.")}
    }
    function notify(message){
      var el=document.getElementById("toast");el.innerHTML=icon("checkcircle",16)+"<span>"+esc(message)+"</span>";el.hidden=false;
      clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},3200)
    }
    window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredInstallPrompt=e});
    window.addEventListener("appinstalled",function(){deferredInstallPrompt=null;notify("Hisaably is installed on your device.")});
    document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")scheduleReminder()});
    render();
    loadAccount();
  })();
  </script>
</body>
</html>
